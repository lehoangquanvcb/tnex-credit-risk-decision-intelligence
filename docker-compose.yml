services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: creditrisk
      POSTGRES_USER: creditrisk
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://creditrisk:change-me@postgres:5432/creditrisk
    ports: ["8000:8000"]
    depends_on: [postgres]
