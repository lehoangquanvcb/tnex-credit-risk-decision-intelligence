name: model-ci
on: [push, pull_request]
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src app api
      - name: Model approval gates
        run: python scripts/model_gate.py
      - name: Scorecard and policy controls
        run: python -m unittest tests.test_v41_controls -v
      - name: IFRS 9 and deployment controls
        run: python scripts/v6_gate.py
      - name: Local scoring latency gate
        run: python scripts/load_test.py
